name: fork-build

# Optional fallback, started by hand (Actions tab > fork-build > Run workflow): builds the dotfiles branch and publishes
# the binaries as a release named `build-<12 character sha>`. Normally the release is built and published on the
# developer's Mac with the dotfiles script `rift-dev.sh publish`; macOS runners can queue for a long time.
# Releases created with the workflow token do not start the other workflows of this repository.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Update Rust
        run: rustup update stable && rustup default stable
      - name: Test
        run: cargo test --lib --locked

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Rust
        run: rustup update stable && rustup default stable
      - name: Build
        run: cargo build --release --locked --bin rift --bin rift-cli
      - name: Package
        run: |
          mkdir dist
          cp target/release/rift dist/rift-fork
          cp target/release/rift-cli dist/rift-cli
          tar -C dist -czf rift-fork-macos-arm64.tar.gz rift-fork rift-cli
          shasum -a 256 rift-fork-macos-arm64.tar.gz > rift-fork-macos-arm64.tar.gz.sha256
          file dist/rift-fork
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$(git rev-parse --short=12 HEAD)"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" rift-fork-macos-arm64.tar.gz rift-fork-macos-arm64.tar.gz.sha256 \
            --target "$GITHUB_SHA" --title "$tag" \
            --notes "Binaries built from $GITHUB_SHA: rift-fork (the window manager) and rift-cli."
